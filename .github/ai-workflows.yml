# Comandos deste repositorio para o fluxo de IA (samuel-morrissey/ai-workflows).
# Chaves: setup_commands, quality_checks, evidence_tools, um comando por linha.
#
# Sem setup_commands: os scripts usam so a biblioteca padrao do Python 3, que o
# runner ja traz. Nao ha lint nem build. A suite roda sem rede e sem gh:
# scripts/test_doctor.py cobre as partes puras do doctor e importa as outras
# suites (test_workflows.py, test_sub_tasks.py e test_responsible.py, a
# resolucao do responsavel), entao um comando so roda todas.
#
# Os evidence_tools sao os proprios scripts: a evidencia de uma mudanca aqui
# e a saida deles, antes e depois. O que capturar e como esta em
# .claude/skills/evidencias/SKILL.md.
quality_checks: |
  python3 scripts/test_doctor.py
evidence_tools: |
  python3 scripts/doctor.py
  python3 scripts/sub_tasks.py
  python3 scripts/test_doctor.py
