name: Issue Refinement

# Workflow reutilizavel de refinamento. Chamado pelo router.yml quando um
# humano aplica `needs-refinement`, aplica `go` em issue com esse label, ou
# responde a uma rodada de perguntas (`needs-refinement` + `awaiting-reply`),
# ou quando a triagem o chama (repository_dispatch `ai-advance`). Cada rodada
# termina em perguntas (awaiting-reply) ou no comentario de refinamento, com
# o issue em needs-break-down, e entao chama a quebra (salvo `auto_advance:
# false`). Os guardas estao no router; ver README.md.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          Label do runner dos jobs. Vazio: `ubuntu-latest`, do GitHub. Um
          label de runner self-hosted (ex.: `vps`) roda o fluxo na maquina do
          dono, sem gastar minutos de Actions.
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

jobs:
  issue-refinement:
    name: Refine Issue
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # O issue vem do evento de issue ou, quando a triagem chamou esta etapa
      # (repository_dispatch `ai-advance`), do payload, que tambem diz qual
      # etapa encadeou (`from`): o `undo` da rodada a desfaz junto.
      - name: Resolver numero do issue
        id: target
        env:
          EVENT_NUMBER: ${{ github.event.issue.number }}
          PAYLOAD_NUMBER: ${{ github.event.client_payload.issue }}
          PAYLOAD_FROM: ${{ github.event.client_payload.from }}
        run: |
          NUMBER="${EVENT_NUMBER:-$PAYLOAD_NUMBER}"
          if ! [[ "$NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Evento sem issue: dispare o workflow chamador em um evento de issue."
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          if [ -z "$EVENT_NUMBER" ] && [ "$PAYLOAD_FROM" = "triagem" ]; then
            echo "from=$PAYLOAD_FROM" >> "$GITHUB_OUTPUT"
          fi

      # Guarda de concorrencia (fluxo-de-issues.md §2.4): issue com
      # work-in-progress ja tem um worker atuando — encerra sem falhar. A
      # etapa que chamou esta ja tirou o work-in-progress dela antes do
      # dispatch. Chamada pelo dispatch, a rodada tambem confere que o issue
      # continua aberto e em needs-refinement: um `undo` ou um humano pode
      # ter mudado o estado entre o dispatch e o comeco desta run.
      - name: Aplicar work-in-progress
        id: wip
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
          FROM: ${{ steps.target.outputs.from }}
          EXPECTED: needs-refinement
        run: |
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'work-in-progress'; then
            echo "::notice::Issue #$NUMBER ja esta com work-in-progress; outro worker esta atuando. Encerrando."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$FROM" ]; then
            INFO=$(gh issue view "$NUMBER" --json state,labels -q '.state, .labels[].name')
            if ! grep -Fqx 'OPEN' <<<"$INFO" || ! grep -Fqx "$EXPECTED" <<<"$INFO" || grep -Fqx 'undo' <<<"$INFO"; then
              echo "::notice::#$NUMBER nao esta mais aberto em $EXPECTED (ou tem undo); a etapa encadeada nao roda."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          gh label create work-in-progress --color D93F0B \
            --description "Worker em execucao nesta issue" 2>/dev/null || true
          gh issue edit "$NUMBER" --add-label work-in-progress
          LABELS=$(gh issue view "$NUMBER" --json labels -q '.labels[].name')
          # Nova rodada = o humano respondeu: sai o sinal de espera. Se a
          # rodada parar em outra pergunta, a skill aplica de novo.
          if grep -Fqx 'awaiting-reply' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label awaiting-reply
          fi
          # O `go` e consumido: a rodada comecou, e o label fica livre para o
          # humano aplicar de novo na etapa seguinte. Criado aqui para ja
          # existir no repositorio quando o humano for procura-lo.
          gh label create go --color 3FB950 \
            --description "Pode seguir: roda a etapa do estado atual" 2>/dev/null || true
          if grep -Fqx 'go' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label go
          fi

      # O responsavel do issue, ja resolvido (scripts/responsible.py, com
      # default_responsible lido deste checkout): a skill marca quem ele diz
      # na rodada de perguntas e no comentario final, sem adivinhar. Falha
      # aqui nao para a rodada: ela segue como "sem responsavel".
      - name: Resolver responsavel
        id: responsavel
        if: steps.wip.outputs.skip != 'true'
        continue-on-error: true
        uses: samuel-morrissey/ai-workflows/.github/actions/responsible@main
        with:
          number: ${{ steps.target.outputs.number }}

      # Fornecedores do consumidor (web_domains de .github/ai-workflows.yml,
      # lido deste checkout): os dominios somam-se a lista fixa do WebFetch e
      # as URLs de entrada vao ao agente pelo system prompt. Linha invalida so
      # avisa; valor que nao e texto falha aqui, antes do agente.
      - name: Ler dominios da web
        id: web
        if: steps.wip.outputs.skip != 'true'
        uses: samuel-morrissey/ai-workflows/.github/actions/web-domains@main

      # Encadeamento (scripts/advance.py): o refinamento que termina em
      # needs-break-down chama a quebra sozinho, salvo `auto_advance: false`
      # em .github/ai-workflows.yml ou um ai.yml ainda sem o tipo
      # `ai-advance` (lidos deste checkout). A frase "Encadeamento:" diz a
      # skill se o `## Refinamento` pede `go` e marca o responsavel. Falha
      # aqui nao para a rodada: sem a frase, a skill pede `go` como sempre.
      - name: Ler encadeamento
        id: chain
        if: steps.wip.outputs.skip != 'true'
        continue-on-error: true
        uses: samuel-morrissey/ai-workflows/.github/actions/advance@main
        with:
          mode: check
          stage: refinamento
          number: ${{ steps.target.outputs.number }}

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/samuel-morrissey/ai-workflows.git"
          plugins: "samuel-morrissey-skills@samuel-morrissey-ai-workflows"
          prompt: "/samuel-morrissey-skills:issue-refinement ${{ steps.target.outputs.number }}"
          # A rodada que a triagem encadeia chega com o ator github-actions[bot]
          # (repository_dispatch `ai-advance` criado com o GITHUB_TOKEN), e a
          # action recusa ator nao humano por padrao. So esse bot e liberado.
          allowed_bots: "github-actions[bot],github-actions"
          # A allowlist espelha o frontmatter da skill issue-refinement; Skill libera a
          # invocacao de labeling, async-first e grilling no meio da execucao.
          # WebFetch so na lista fixa de dominios, mais os de web_domains (Uso da web, no AGENT-BRIEF.md da issue-triage).
          claude_args: |
            --model claude-opus-5-5
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue close:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,WebFetch(domain:docs.github.com),WebFetch(domain:code.claude.com),WebFetch(domain:platform.claude.com)${{ steps.web.outputs.allow }},Skill,TodoWrite"
            --max-turns 80
            --append-system-prompt "${{ steps.responsavel.outputs.sentence }}${{ steps.web.outputs.sentence }}${{ steps.chain.outputs.sentence }}"

      # Rede de seguranca: se a rodada terminou e o issue continua em
      # `needs-refinement`, a rodada parou em pergunta. Garante o awaiting-reply, caso
      # a skill nao o tenha aplicado. O `needs-refinement` fica: e ele que faz o
      # proximo comentario humano disparar nova rodada.
      - name: Garantir awaiting-reply se a rodada parou em pergunta
        if: always() && steps.wip.outcome == 'success' && steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          INFO=$(gh issue view "$NUMBER" --json state,labels)
          STATE=$(jq -r '.state' <<<"$INFO")
          LABELS=$(jq -r '.labels[].name' <<<"$INFO")
          if [ "$STATE" = "OPEN" ] && grep -Fqx 'needs-refinement' <<<"$LABELS" && ! grep -Fqx 'awaiting-reply' <<<"$LABELS"; then
            gh label create awaiting-reply --color C5DEF5 \
              --description "Aguardando resposta humana" 2>/dev/null || true
            gh issue edit "$NUMBER" --add-label awaiting-reply
          fi

      # `undo` aplicado durante a rodada: o evento dele foi pulado pela
      # guarda de work-in-progress, mas o label nao e descartado. Processado
      # aqui, com o work-in-progress ainda nesta rodada: desfaz a ultima
      # mudanca de estado, que pode ser a que esta rodada acabou de fazer, ou
      # recusa com comentario. Sem `undo` no issue, nada acontece. Numa
      # rodada encadeada pela triagem (`from`), desfaz as duas: este
      # refinamento, se mudou o estado, e a triagem. Falha aqui nao segura o
      # work-in-progress.
      - name: Processar undo da rodada
        id: undo
        if: always() && steps.wip.outcome == 'success' && steps.wip.outputs.skip != 'true'
        continue-on-error: true
        uses: samuel-morrissey/ai-workflows/.github/actions/undo@main
        with:
          number: ${{ steps.target.outputs.number }}
          pending: "true"
          chained_from: ${{ steps.target.outputs.from }}

      # Remove o WIP mesmo quando a action falha — mas so se foi este worker
      # que o aplicou (skip vazio), para nao apagar o label de outro worker.
      # Um `go` que chegou durante a rodada tambem sai: o evento dele foi
      # pulado pelo guarda de concorrencia, e um label que ja esta no issue
      # nao pode ser aplicado de novo. O humano aplica outro quando quiser a
      # proxima etapa.
      - name: Remover work-in-progress
        if: always() && steps.wip.outcome == 'success' && steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          gh issue edit "$NUMBER" --remove-label work-in-progress
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'go'; then
            echo "::notice::go chegou durante a rodada em #$NUMBER e foi descartado; aplique de novo para a proxima etapa."
            gh issue edit "$NUMBER" --remove-label go
          fi

      # A quebra, sem `go`: o refinamento que terminou em needs-break-down a
      # chama por um repository_dispatch do tipo `ai-advance`. Roda depois de
      # tirar o work-in-progress, para a guarda da quebra nao pula-la por
      # causa do label desta rodada. Nao chama nada com o encadeamento
      # desligado, rodada de perguntas, issue fechado ou fora do fluxo, ou
      # `undo` na rodada; nem quando algum passo falhou (o round-failure
      # comenta). Dispatch que falha vira comentario novo pedindo `go`, com o
      # responsavel marcado.
      - name: Chamar a etapa seguinte
        if: success() && steps.wip.outputs.skip != 'true'
        continue-on-error: true
        uses: samuel-morrissey/ai-workflows/.github/actions/advance@main
        with:
          mode: run
          stage: refinamento
          number: ${{ steps.target.outputs.number }}
          enabled: ${{ steps.chain.outputs.enabled }}
          before: ${{ steps.chain.outputs.before }}
          logins: ${{ steps.responsavel.outputs.logins }}
          undo_result: ${{ steps.undo.outputs.result }}

      # Registro da falha para o humano. Quem escreve no issue e a skill, de
      # dentro do agente; quando um passo falha fora dela (configuracao
      # invalida, setup_commands, planner, a propria action do agente), o
      # issue ficava como antes do `go`, sem nenhum sinal. Este passo roda so
      # quando algum passo anterior falhou e comenta no issue a etapa, o passo
      # que falhou (lido da run) e o link da run. Nunca derruba o job nem
      # mascara a falha original: a run continua marcada como falha.
      - name: Registrar metricas da rodada
        if: always()
        continue-on-error: true
        uses: samuel-morrissey/ai-workflows/.github/actions/metrics@main
        with:
          etapa: issue-refinement
          number: ${{ steps.target.outputs.number }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          max_turns: 80

      - name: Comentar falha da rodada
        if: failure()
        continue-on-error: true
        uses: samuel-morrissey/ai-workflows/.github/actions/round-failure@main
        with:
          etapa: refinamento
          number: ${{ steps.target.outputs.number }}
