name: Issue Refinement

# Workflow reutilizavel de refinamento. Chamado pelo router.yml quando um
# humano aplica `needs-refinement`, aplica `go` em issue com esse label, ou
# responde a uma rodada de perguntas (`needs-refinement` + `awaiting-reply`). Cada rodada
# termina em perguntas (awaiting-reply) ou no comentario de refinamento, com
# o issue em needs-break-down. Os guardas estao no router; ver README.md.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

jobs:
  issue-refinement:
    name: Refine Issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolver numero do issue
        id: target
        env:
          EVENT_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$EVENT_NUMBER" ]; then
            echo "::error::Evento sem issue: dispare o workflow chamador em um evento de issue."
            exit 1
          fi
          echo "number=$EVENT_NUMBER" >> "$GITHUB_OUTPUT"

      # Guarda de concorrencia (fluxo-de-issues.md §2.4): issue com
      # work-in-progress ja tem um worker atuando — encerra sem falhar.
      - name: Aplicar work-in-progress
        id: wip
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'work-in-progress'; then
            echo "::notice::Issue #$NUMBER ja esta com work-in-progress; outro worker esta atuando. Encerrando."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create work-in-progress --color D93F0B \
            --description "Worker em execucao nesta issue" 2>/dev/null || true
          gh issue edit "$NUMBER" --add-label work-in-progress
          LABELS=$(gh issue view "$NUMBER" --json labels -q '.labels[].name')
          # Nova rodada = o humano respondeu: sai o sinal de espera. Se a
          # rodada parar em outra pergunta, a skill aplica de novo.
          if grep -Fqx 'awaiting-reply' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label awaiting-reply
          fi
          # O `go` e consumido: a rodada comecou, e o label fica livre para o
          # humano aplicar de novo na etapa seguinte. Criado aqui para ja
          # existir no repositorio quando o humano for procura-lo.
          gh label create go --color 3FB950 \
            --description "Pode seguir: roda a etapa do estado atual" 2>/dev/null || true
          if grep -Fqx 'go' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label go
          fi

      # O responsavel do issue, ja resolvido (scripts/responsible.py, com
      # default_responsible lido deste checkout): a skill marca quem ele diz
      # na rodada de perguntas e no comentario final, sem adivinhar. Falha
      # aqui nao para a rodada: ela segue como "sem responsavel".
      - name: Resolver responsavel
        id: responsavel
        if: steps.wip.outputs.skip != 'true'
        continue-on-error: true
        uses: samuel-morrissey/ai-workflows/.github/actions/responsible@main
        with:
          number: ${{ steps.target.outputs.number }}

      - uses: anthropics/claude-code-action@v1
        if: steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/samuel-morrissey/ai-workflows.git"
          plugins: "samuel-morrissey-skills@samuel-morrissey-ai-workflows"
          prompt: "/samuel-morrissey-skills:issue-refinement ${{ steps.target.outputs.number }}"
          # A allowlist espelha o frontmatter da skill issue-refinement; Skill libera a
          # invocacao de labeling, async-first e grilling no meio da execucao.
          claude_args: |
            --model claude-opus-5-5
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue close:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,Skill,TodoWrite"
            --max-turns 80
            --append-system-prompt "${{ steps.responsavel.outputs.sentence }}"

      # Rede de seguranca: se a rodada terminou e o issue continua em
      # `needs-refinement`, a rodada parou em pergunta. Garante o awaiting-reply, caso
      # a skill nao o tenha aplicado. O `needs-refinement` fica: e ele que faz o
      # proximo comentario humano disparar nova rodada.
      - name: Garantir awaiting-reply se a rodada parou em pergunta
        if: always() && steps.wip.outcome == 'success' && steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          INFO=$(gh issue view "$NUMBER" --json state,labels)
          STATE=$(jq -r '.state' <<<"$INFO")
          LABELS=$(jq -r '.labels[].name' <<<"$INFO")
          if [ "$STATE" = "OPEN" ] && grep -Fqx 'needs-refinement' <<<"$LABELS" && ! grep -Fqx 'awaiting-reply' <<<"$LABELS"; then
            gh label create awaiting-reply --color C5DEF5 \
              --description "Aguardando resposta humana" 2>/dev/null || true
            gh issue edit "$NUMBER" --add-label awaiting-reply
          fi

      # Remove o WIP mesmo quando a action falha — mas so se foi este worker
      # que o aplicou (skip vazio), para nao apagar o label de outro worker.
      # Um `go` que chegou durante a rodada tambem sai: o evento dele foi
      # pulado pelo guarda de concorrencia, e um label que ja esta no issue
      # nao pode ser aplicado de novo. O humano aplica outro quando quiser a
      # proxima etapa.
      - name: Remover work-in-progress
        if: always() && steps.wip.outcome == 'success' && steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          gh issue edit "$NUMBER" --remove-label work-in-progress
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'go'; then
            echo "::notice::go chegou durante a rodada em #$NUMBER e foi descartado; aplique de novo para a proxima etapa."
            gh issue edit "$NUMBER" --remove-label go
          fi

      # Registro da falha para o humano. Quem escreve no issue e a skill, de
      # dentro do agente; quando um passo falha fora dela (configuracao
      # invalida, setup_commands, planner, a propria action do agente), o
      # issue ficava como antes do `go`, sem nenhum sinal. Este passo roda so
      # quando algum passo anterior falhou e comenta no issue a etapa, o passo
      # que falhou (lido da run) e o link da run. Nunca derruba o job nem
      # mascara a falha original: a run continua marcada como falha.
      - name: Comentar falha da rodada
        if: failure()
        continue-on-error: true
        uses: samuel-morrissey/ai-workflows/.github/actions/round-failure@main
        with:
          etapa: refinamento
          number: ${{ steps.target.outputs.number }}
