name: Issue Triage

# Workflow reutilizavel de triagem. Chamado pelo router.yml quando um humano
# aplica `needs-triage`, aplica `go` em issue com `needs-triage` ou sem label
# de estado, responde a um handoff (`needs-triage` + `awaiting-reply`) ou
# aplica `wontfix` ou `deferred` (a skill completa o fechamento). Os guardas
# estao no router; ver README.md.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

jobs:
  issue-triage:
    name: Triage Issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolver numero do issue
        id: target
        env:
          EVENT_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$EVENT_NUMBER" ]; then
            echo "::error::Evento sem issue: dispare o workflow chamador em um evento de issue."
            exit 1
          fi
          echo "number=$EVENT_NUMBER" >> "$GITHUB_OUTPUT"

      # Guarda de concorrencia (fluxo-de-issues.md §2.4): issue com
      # work-in-progress ja tem um worker atuando — encerra sem falhar.
      - name: Aplicar work-in-progress
        id: wip
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'work-in-progress'; then
            echo "::notice::Issue #$NUMBER ja esta com work-in-progress; outro worker esta atuando. Encerrando."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create work-in-progress --color D93F0B \
            --description "Worker em execucao nesta issue" 2>/dev/null || true
          gh issue edit "$NUMBER" --add-label work-in-progress
          LABELS=$(gh issue view "$NUMBER" --json labels -q '.labels[].name')
          # Nova rodada = o humano respondeu: sai o sinal de espera. Se a
          # rodada parar em outra pergunta, a skill aplica de novo.
          if grep -Fqx 'awaiting-reply' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label awaiting-reply
          fi
          # O `go` e consumido: a rodada comecou, e o label fica livre para o
          # humano aplicar de novo na etapa seguinte. Criado aqui para ja
          # existir no repositorio quando o humano for procura-lo.
          gh label create go --color 3FB950 \
            --description "Pode seguir: roda a etapa do estado atual" 2>/dev/null || true
          if grep -Fqx 'go' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label go
          fi
          # `go` em issue sem label de estado (criado por agente, por exemplo):
          # a triagem e a etapa de entrada, e a skill espera o needs-triage.
          if ! grep -Eq '^(needs-|ready-for-|awaiting-pr-review|wontfix|deferred)' <<<"$LABELS"; then
            gh label create needs-triage --color FBCA04 \
              --description "Issue crua aguardando triagem" 2>/dev/null || true
            gh issue edit "$NUMBER" --add-label needs-triage
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/samuel-morrissey/ai-workflows.git"
          plugins: "samuel-morrissey-skills@samuel-morrissey-ai-workflows"
          prompt: "/samuel-morrissey-skills:issue-triage ${{ steps.target.outputs.number }}"
          # A allowlist espelha o frontmatter da skill issue-triage; Skill libera a
          # invocacao de labeling, async-first e grilling no meio da execucao.
          claude_args: |
            --model claude-opus-5-5
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue close:*),Bash(gh label list:*),Bash(gh label create:*),Read,Grep,Glob,Skill,TodoWrite"
            --max-turns 50

      # A skill troca needs-triage pelo label de estado ao concluir. Este passo
      # e a rede de seguranca: se o issue saiu da triagem (fechado, com outro
      # label de estado, ou terminal em wontfix/deferred) e ainda carrega
      # needs-triage, remove. Se nao saiu
      # (handoff aguardando resposta humana), mantem — e o needs-triage que faz
      # o proximo comentario humano disparar nova rodada — e garante o
      # awaiting-reply, caso a skill nao o tenha aplicado.
      - name: Remover needs-triage se a triagem concluiu
        if: always() && steps.wip.outcome == 'success' && steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          INFO=$(gh issue view "$NUMBER" --json state,labels)
          STATE=$(jq -r '.state' <<<"$INFO")
          LABELS=$(jq -r '.labels[].name' <<<"$INFO")
          if ! grep -Fqx 'needs-triage' <<<"$LABELS"; then
            exit 0
          fi
          if [ "$STATE" = "CLOSED" ] || grep -Eqx 'needs-(discovery|refinement|break-down)|ready-for-(agent|human)|wontfix|deferred' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label needs-triage
          else
            echo "::notice::Triagem em handoff: needs-triage mantido em #$NUMBER para a proxima rodada."
            if ! grep -Fqx 'awaiting-reply' <<<"$LABELS"; then
              gh label create awaiting-reply --color C5DEF5 \
                --description "Aguardando resposta humana" 2>/dev/null || true
              gh issue edit "$NUMBER" --add-label awaiting-reply
            fi
          fi

      # Remove o WIP mesmo quando a action falha — mas so se foi este worker
      # que o aplicou (skip vazio), para nao apagar o label de outro worker.
      # Um `go` que chegou durante a rodada tambem sai: o evento dele foi
      # pulado pelo guarda de concorrencia, e um label que ja esta no issue
      # nao pode ser aplicado de novo. O humano aplica outro quando quiser a
      # proxima etapa.
      - name: Remover work-in-progress
        if: always() && steps.wip.outcome == 'success' && steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          gh issue edit "$NUMBER" --remove-label work-in-progress
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'go'; then
            echo "::notice::go chegou durante a rodada em #$NUMBER e foi descartado; aplique de novo para a proxima etapa."
            gh issue edit "$NUMBER" --remove-label go
          fi
