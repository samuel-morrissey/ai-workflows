name: AI

# Chamador dos fluxos de IA. Roda nos issues deste repositorio e e o modelo
# que os outros repositorios da organizacao copiam para
# `.github/workflows/ai.yml` (passo a passo no README.md).
#
# As regras (qual evento aciona qual etapa, guardas, labels) moram no
# router.yml. Este arquivo so declara o que o GitHub exige que fique no
# chamador: gatilhos (`on:`) e permissoes.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Uniao das permissoes pedidas pelas etapas. Um reutilizavel nunca recebe mais
# do que o chamador concede, por isso todas ficam aqui.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  ai:
    uses: caravelasistemas/ai-workflows/.github/workflows/router.yml@main
    # Comandos de verificacao de qualidade, um por linha, rodados pela etapa
    # issue-remote-implement antes de abrir o PR. Vazio: segue sem
    # verificacao. Este repositorio nao tem build nem testes; no consumidor,
    # descomente e ajuste:
    # with:
    #   quality_checks: |
    #     npm run typecheck
    #     npm test
    secrets: inherit
