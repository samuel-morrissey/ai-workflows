name: AI

# Chamador dos fluxos de IA de samuel-morrissey/ai-workflows: triagem,
# refinamento, quebra em sub-tasks e implementacao a partir dos issues, com
# QA independente e evidencias no PR.
#
# Este arquivo e IDENTICO em todo repositorio que usa o fluxo, inclusive
# neste. Nao edite a copia: o que varia por repositorio mora fora dele.
#
# - Comandos do projeto (setup_commands, quality_checks, evidence_tools):
#   em `.github/ai-workflows.yml`, lido pelo workflow depois do checkout.
# - Bucket de evidencias: variaveis EVIDENCE_BUCKET, EVIDENCE_PUBLIC_URL e
#   EVIDENCE_ENDPOINT, do repositorio ou da organizacao. Sem elas, as
#   evidencias vao como artifact da run.
# - Secrets: CLAUDE_CODE_OAUTH_TOKEN (obrigatorio), EVIDENCE_ACCESS_KEY_ID e
#   EVIDENCE_SECRET_ACCESS_KEY (com bucket) e PROJECT_ENV (opcional: um .env
#   com o que o ambiente do QA exige), do repositorio ou da organizacao.
#
# Passo a passo, verificacao e correcao: README.md e scripts/doctor.py em
# samuel-morrissey/ai-workflows. As regras (qual evento aciona qual etapa,
# guardas, labels) moram no router.yml de la. Este arquivo so declara o que o
# GitHub exige que fique no chamador: gatilhos (`on:`) e permissoes.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  # Elos da cadeia de sub-tasks: o planner do pai chama o worker da proxima
  # sub-task (`ai-sub-task`) e o worker devolve o controle ao pai
  # (`ai-implement`). Evento criado pelos proprios workflows, com o
  # GITHUB_TOKEN. Sem estes dois tipos, um pai com sub-tasks para na primeira.
  repository_dispatch:
    types: [ai-implement, ai-sub-task]

# Uniao das permissoes pedidas pelas etapas. Um reutilizavel nunca recebe mais
# do que o chamador concede, por isso todas ficam aqui.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  ai:
    uses: samuel-morrissey/ai-workflows/.github/workflows/router.yml@main
    # O chamador enxerga as variaveis do proprio repositorio e da organizacao;
    # variavel ausente resolve vazio, e o fluxo segue em modo artifact.
    with:
      evidence_bucket: ${{ vars.EVIDENCE_BUCKET }}
      evidence_public_url: ${{ vars.EVIDENCE_PUBLIC_URL }}
      evidence_endpoint: ${{ vars.EVIDENCE_ENDPOINT }}
    # Passados pelo nome, e nao por `secrets: inherit`: o inherit so repassa
    # secret de organizacao quando o reutilizavel esta no mesmo dono. Secret
    # ausente chega vazio e o fluxo trata como opcional.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EVIDENCE_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      EVIDENCE_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      PROJECT_ENV: ${{ secrets.PROJECT_ENV }}
