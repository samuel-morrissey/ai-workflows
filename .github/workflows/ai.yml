name: AI

# Chamador dos fluxos de IA. Roda nos issues deste repositorio e e o modelo
# que os outros repositorios da organizacao copiam para
# `.github/workflows/ai.yml` (passo a passo no README.md).
#
# As regras (qual evento aciona qual etapa, guardas, labels) moram no
# router.yml. Este arquivo so declara o que o GitHub exige que fique no
# chamador: gatilhos (`on:`) e permissoes.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  # Elos da cadeia de sub-tasks: o planner do pai chama o worker da proxima
  # sub-task (`ai-sub-task`) e o worker devolve o controle ao pai
  # (`ai-implement`). Evento criado pelos proprios workflows, com o
  # GITHUB_TOKEN. Sem estes dois tipos, um pai com sub-tasks para na primeira.
  repository_dispatch:
    types: [ai-implement, ai-sub-task]

# Uniao das permissoes pedidas pelas etapas. Um reutilizavel nunca recebe mais
# do que o chamador concede, por isso todas ficam aqui.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  ai:
    uses: samuel-morrissey/ai-workflows/.github/workflows/router.yml@main
    # Dois inputs, um comando por linha cada, usados pela etapa
    # issue-remote-implement:
    #
    # - setup_commands: preparacao do ambiente, rodada pelo workflow antes de
    #   chamar o agente. Comando que falha interrompe o job. Vazio: nada roda.
    #   Precisa de uma versao especifica de runtime? Resolva aqui; mudanca de
    #   PATH so chega ao agente se gravada em $GITHUB_PATH.
    # - quality_checks: verificacao rodada pelo agente antes de abrir o PR.
    #   Vazio: o PR sai declarando que nao houve verificacao.
    #
    # Este repositorio nao tem build nem testes, por isso vai sem os dois. No
    # consumidor, descomente e ajuste:
    # with:
    #   setup_commands: |
    #     npm ci
    #   quality_checks: |
    #     npm run typecheck
    #     npm test
    # Passado pelo nome, e nao por `secrets: inherit`: o inherit so repassa
    # secret de organizacao quando o reutilizavel esta no mesmo dono. Um
    # consumidor em outra organizacao ficaria sem o secret.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
