name: Issue Sub-task

# Workflow reutilizavel: worker de UMA sub-task. Chamado pelo router.yml
# quando:
# - o planner do pai (issue-remote-implement.yml) despacha a proxima
#   sub-task por repository_dispatch `ai-sub-task`;
# - um humano aplica `go` numa `[SUB-TASK]` (resolve so essa sub-task);
# - um humano responde a um handoff da sub-task (`[SUB-TASK]` +
#   awaiting-reply).
#
# Roda o agente com a skill issue-remote-implement em modo sub-task: a branch
# `sub-task-<n>` nasce do topo da stack do pai (a branch do PR aberto mais
# alto, ou a branch padrao) e o PR aponta para essa mesma base. No fim, o
# worker devolve o controle ao pai por repository_dispatch `ai-implement`,
# com o resultado da rodada (pr, handoff, none, skipped); o planner do pai
# decide se a cadeia segue, espera ou para. Ver README.md.

on:
  workflow_call:
    inputs:
      setup_commands:
        description: >-
          Comandos de preparacao do ambiente do repositorio consumidor, um por
          linha. Mesma semantica do input de issue-remote-implement.yml.
        type: string
        required: false
        default: ""
      quality_checks:
        description: >-
          Comandos de verificacao de qualidade do repositorio consumidor, um por
          linha. Mesma semantica do input de issue-remote-implement.yml.
        type: string
        required: false
        default: ""
      evidence_tools:
        description: >-
          Prefixos de comando liberados ao agente para subir o projeto e
          capturar evidencias, um por linha (ex.: `node`, `npx playwright`,
          `curl`, `asciinema`). Cada linha vira Bash(<linha>:*) na allowlist e
          e informada a skill. Liga o QA independente (skill issue-qa, ate
          duas rodadas antes do PR). Linhas que citam playwright, ffmpeg,
          asciinema ou agg fazem o workflow instalar essas ferramentas antes
          de chamar o agente. Vazio: o QA nao roda e o PR declara isso.
        type: string
        required: false
        default: ""
      evidence_bucket:
        description: >-
          Destino das evidencias num bucket compativel com S3, no formato
          `s3://bucket[/prefixo]`. O workflow envia a pasta de evidencias para
          la depois da rodada, com as credenciais dos secrets
          EVIDENCE_ACCESS_KEY_ID e EVIDENCE_SECRET_ACCESS_KEY. Exige
          evidence_public_url. Vazio, ou upload que falha: as evidencias vao
          como artifact da run, so com link no PR.
        type: string
        required: false
        default: ""
      evidence_public_url:
        description: >-
          URL publica que corresponde a raiz de evidence_bucket (ex.:
          `https://pub-xxxx.r2.dev` ou
          `https://bucket.s3.amazonaws.com/prefixo`). O agente escreve no PR
          as URLs finais a partir dela antes do upload acontecer.
        type: string
        required: false
        default: ""
      evidence_endpoint:
        description: >-
          Endpoint S3 para provedores fora da AWS (ex.: Cloudflare R2,
          MinIO). Vazio: AWS.
        type: string
        required: false
        default: ""
      ai_workflows_ref:
        description: >-
          Ref de samuel-morrissey/ai-workflows de onde baixar o planner
          (scripts/sub_tasks.py). O padrao, `main`, e o que todo consumidor
          usa; outro valor serve para testar uma branch deste repositorio.
        type: string
        required: false
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      EVIDENCE_ACCESS_KEY_ID:
        required: false
      EVIDENCE_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  issue-sub-task:
    name: Implement Sub-task
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # O planner (scripts/sub_tasks.py deste repositorio) e a unica fonte da
      # ordem das camadas e da base de cada sub-task. Baixado da ref informada
      # (main, por padrao), fora do workspace do consumidor para o agente nao
      # o ver como arquivo do projeto.
      - name: Baixar o planner
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ai_workflows_ref }}
        run: |
          gh api "repos/samuel-morrissey/ai-workflows/contents/scripts/sub_tasks.py?ref=$REF" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/sub_tasks.py"

      # Alvo: a sub-task do evento (`go` ou comentario) ou do payload do
      # dispatch. Le o pai, a base e os bloqueios pelo planner. Sub-task que
      # nao pode rodar (ja tem PR aberto, bloqueada sem PR, humana, sem pai)
      # encerra com um comentario quando foi um humano que pediu; vinda da
      # cadeia, so devolve `skipped` ao pai.
      - name: Resolver alvo
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_NUMBER: ${{ github.event.issue.number }}
          PAYLOAD_NUMBER: ${{ github.event.client_payload.issue }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            NUMBER="$PAYLOAD_NUMBER"; SOURCE=chain
          else
            NUMBER="$EVENT_NUMBER"; SOURCE=human
          fi
          if [ -z "$NUMBER" ]; then
            echo "::error::Evento sem sub-task: dispare o workflow chamador em um evento de issue ou com client_payload.issue."
            exit 1
          fi
          INFO=$(python3 -I "$RUNNER_TEMP/sub_tasks.py" base "$NUMBER")
          echo "$INFO"
          IS_SUB=$(jq -r '.is_sub_task' <<<"$INFO")
          STATE=$(jq -r '.state' <<<"$INFO")
          PARENT=$(jq -r '.parent // empty' <<<"$INFO")
          BASE=$(jq -r '.base' <<<"$INFO")
          OPEN_PR=$(jq -r '.open_pr // empty' <<<"$INFO")
          HUMAN=$(jq -r '.human' <<<"$INFO")
          BLOCKED=$(jq -r '.blocked_open | map("#\(.)") | join(", ")' <<<"$INFO")
          {
            echo "number=$NUMBER"; echo "source=$SOURCE"; echo "parent=$PARENT"; echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"
          say() { [ "$SOURCE" = "human" ] && gh issue comment "$NUMBER" --body "$1" || true; }
          if [ "$IS_SUB" != "true" ] || [ "$STATE" != "open" ]; then
            echo "::notice::#$NUMBER nao e uma [SUB-TASK] aberta; nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$PARENT" ]; then
            say "Esta sub-task nao esta ligada a um pai (sub-issue) e o corpo nao diz \`Parte de #<pai>\`. Ligue ao pai e aplique \`go\` de novo."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$OPEN_PR" ]; then
            say "Ja existe o PR #$OPEN_PR desta sub-task em revisao. Esta etapa nao itera em PR existente: revise e faca o merge dele, ou feche-o para a sub-task ser refeita."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HUMAN" = "true" ]; then
            say "Esta sub-task e humana (\`**Executor:** humano\`): o agente so orienta. Faca a parte dela e aplique \`go\` no pai #$PARENT para a cadeia seguir."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$BLOCKED" ]; then
            say "Esta sub-task esta bloqueada por $BLOCKED, que ainda nao tem PR nem fechou. Aplique \`go\` no pai #$PARENT para o agente seguir a ordem, ou implemente os bloqueadores antes."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

      # Guarda de concorrencia: sub-task com work-in-progress ja tem um worker
      # atuando — encerra sem falhar. Consome o `go` e o `awaiting-reply`.
      - name: Aplicar work-in-progress
        id: wip
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'work-in-progress'; then
            echo "::notice::Sub-task #$NUMBER ja esta com work-in-progress; outro worker esta atuando. Encerrando."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create work-in-progress --color D93F0B \
            --description "Worker em execucao nesta issue" 2>/dev/null || true
          gh issue edit "$NUMBER" --add-label work-in-progress
          LABELS=$(gh issue view "$NUMBER" --json labels -q '.labels[].name')
          if grep -Fqx 'awaiting-reply' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label awaiting-reply
          fi
          gh label create go --color 3FB950 \
            --description "Pode seguir: roda a etapa do estado atual" 2>/dev/null || true
          if grep -Fqx 'go' <<<"$LABELS"; then
            gh issue edit "$NUMBER" --remove-label go
          fi

      # Mesmo tratamento de quality_checks do issue-remote-implement.yml: cada
      # linha vira prefixo na allowlist e item do system prompt. Aqui o system
      # prompt leva tambem o modo sub-task: o pai e a base da branch e do PR.
      - name: Preparar modo sub-task, verificacao de qualidade e evidencias
        id: quality
        if: steps.target.outputs.skip != 'true' && steps.wip.outputs.skip != 'true'
        env:
          QUALITY_CHECKS: ${{ inputs.quality_checks }}
          EVIDENCE_TOOLS: ${{ inputs.evidence_tools }}
          EVIDENCE_BUCKET: ${{ inputs.evidence_bucket }}
          EVIDENCE_PUBLIC_URL: ${{ inputs.evidence_public_url }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.target.outputs.number }}
          PARENT: ${{ steps.target.outputs.parent }}
          BASE: ${{ steps.target.outputs.base }}
        run: |
          ALLOW=""
          LIST=""
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            ALLOW="${ALLOW},Bash(${line}:*)"
            LIST="${LIST}${LIST:+ ; }${line}"
          done <<<"$QUALITY_CHECKS"
          SUBTASK="Modo sub-task: #${NUMBER} e sub-task do pai #${PARENT}. A branch sub-task-${NUMBER} nasce de origin/${BASE} e o PR tem base ${BASE}; o workflow ja calculou isso pela ordem da stack, nao recalcule."
          if [ -n "$LIST" ]; then
            QUALITY="Verificacao de qualidade: o workflow chamador liberou e pede que voce rode, nesta ordem, os comandos: ${LIST}."
            echo "::notice::quality_checks: ${LIST}"
          else
            QUALITY="Verificacao de qualidade: nenhum comando liberado; siga sem verificacao e declare isso no PR."
            echo "::notice::Sem quality_checks: a skill segue sem verificacao e declara isso no PR."
          fi
          # Evidencias: pasta fora do workspace, prefixo imprevisivel no bucket e
          # a frase que diz ao agente onde gravar, como referenciar e o que pode
          # rodar. As URLs sao decididas AQUI, antes do agente, para o PR ja
          # sair com elas; o upload acontece depois (passo "Publicar
          # evidencias"). Sem bucket, o destino e o artifact da run.
          EV_ALLOW=""
          EV_LIST=""
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            EV_ALLOW="${EV_ALLOW},Bash(${line}:*)"
            EV_LIST="${EV_LIST}${EV_LIST:+ ; }${line}"
          done <<<"$EVIDENCE_TOOLS"
          ALLOW="${ALLOW}${EV_ALLOW}"
          echo "allow=$ALLOW" >> "$GITHUB_OUTPUT"
          DIR="$RUNNER_TEMP/evidencias"
          mkdir -p "$DIR"
          PREFIX="${GH_REPO}/${NUMBER}/${GITHUB_RUN_ID}-$(openssl rand -hex 6)"
          RUN_URL="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$EVIDENCE_BUCKET" ] && [ -n "$EVIDENCE_PUBLIC_URL" ]; then
            MODE=bucket
            BASE_URL="${EVIDENCE_PUBLIC_URL%/}/${PREFIX}"
            PUBLISH="Publicacao: depois da rodada cada arquivo dessa pasta estara publico em ${BASE_URL}/<nome-do-arquivo>; referencie imagens no PR como ![nome](${BASE_URL}/<arquivo>) e os demais arquivos como link para essa URL."
          else
            MODE=artifact
            BASE_URL=""
            PUBLISH="Publicacao: depois da rodada a pasta sera anexada como artifact evidencias-${NUMBER} da run ${RUN_URL}; no PR, linke a run e cite cada arquivo pelo nome (sem renderizacao inline)."
            [ -n "$EVIDENCE_BUCKET" ] && echo "::warning::evidence_bucket sem evidence_public_url: evidencias vao como artifact."
          fi
          if [ -n "$EV_LIST" ]; then
            TOOLS="Ferramentas liberadas para captura e QA: ${EV_LIST}."
            echo "::notice::evidence_tools: ${EV_LIST} (publicacao: ${MODE})"
          else
            TOOLS="Ferramentas liberadas para captura e QA: nenhuma (o QA independente nao roda; declare isso no PR)."
            echo "::notice::Sem evidence_tools: o QA independente nao roda."
          fi
          EVIDENCE="Evidencias: grave toda captura e o relatorio do QA na pasta ${DIR}, fora do workspace, sem commitar. ${PUBLISH} ${TOOLS}"
          {
            echo "dir=$DIR"; echo "prefix=$PREFIX"; echo "mode=$MODE"; echo "base_url=$BASE_URL"; echo "run_url=$RUN_URL"
          } >> "$GITHUB_OUTPUT"
          echo "sysprompt=--append-system-prompt \"${SUBTASK} ${QUALITY} ${EVIDENCE}\"" >> "$GITHUB_OUTPUT"
          echo "::notice::${SUBTASK}"

      - name: Preparar ambiente do consumidor
        if: steps.target.outputs.skip != 'true' && steps.wip.outputs.skip != 'true'
        env:
          SETUP_COMMANDS: ${{ inputs.setup_commands }}
        run: |
          set -e
          RAN=0
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "::group::setup: ${line}"
            eval "$line" </dev/null
            echo "::endgroup::"
            RAN=$((RAN + 1))
          done <<<"$SETUP_COMMANDS"
          if [ "$RAN" -eq 0 ]; then
            echo "::notice::Sem setup_commands: nenhum comando de preparacao executado."
          fi

      # Ferramentas de captura, instaladas so quando evidence_tools as cita.
      # Depois do setup do consumidor, para o `npx playwright` usar a versao
      # do projeto quando ela existe. Falha aqui nao derruba o job: o QA
      # registra Ambiente falhou e o PR sai declarando.
      - name: Instalar ferramentas de evidencia
        if: steps.target.outputs.skip != 'true' && steps.wip.outputs.skip != 'true' && inputs.evidence_tools != ''
        env:
          EVIDENCE_TOOLS: ${{ inputs.evidence_tools }}
        run: |
          if grep -qi 'playwright' <<<"$EVIDENCE_TOOLS"; then
            echo "::group::playwright (chromium)"
            npx --yes playwright install --with-deps chromium || echo "::warning::Falha ao instalar o Playwright; o QA vai registrar Ambiente falhou."
            echo "::endgroup::"
          fi
          if grep -qiE 'ffmpeg|playwright' <<<"$EVIDENCE_TOOLS" && ! command -v ffmpeg >/dev/null; then
            echo "::group::ffmpeg"
            sudo apt-get install -y -qq ffmpeg || echo "::warning::Falha ao instalar o ffmpeg; gravacoes ficam em webm."
            echo "::endgroup::"
          fi
          if grep -qi 'asciinema' <<<"$EVIDENCE_TOOLS" && ! command -v asciinema >/dev/null; then
            echo "::group::asciinema"
            sudo apt-get install -y -qq asciinema || echo "::warning::Falha ao instalar o asciinema."
            echo "::endgroup::"
          fi
          if grep -qiw 'agg' <<<"$EVIDENCE_TOOLS" && ! command -v agg >/dev/null; then
            echo "::group::agg"
            (curl -fsSL https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu -o /tmp/agg \
              && sudo install -m 0755 /tmp/agg /usr/local/bin/agg) || echo "::warning::Falha ao instalar o agg; gravacoes de terminal ficam em .cast."
            echo "::endgroup::"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.target.outputs.skip != 'true' && steps.wip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/samuel-morrissey/claude-marketplace.git"
          plugins: "samuel-morrissey-skills@samuel-morrissey-claude-marketplace"
          prompt: "/samuel-morrissey-skills:issue-remote-implement ${{ steps.target.outputs.number }}"
          settings: '{"attribution":{"pr":""}}'
          # A rodada despachada pela cadeia chega com o ator github-actions[bot]
          # (repository_dispatch criado com o GITHUB_TOKEN), e a action recusa
          # ator nao humano por padrao. So esse bot e liberado.
          allowed_bots: "github-actions[bot],github-actions"
          # Mesma allowlist do issue-remote-implement.yml (a skill e a mesma),
          # com git worktree, Agent (QA independente como subagente) e os
          # prefixos derivados de quality_checks e de evidence_tools.
          claude_args: |
            --model claude-opus-5-5
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh label create:*),Bash(gh api:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(git status:*),Bash(git branch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git fetch:*),Bash(git pull:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git log:*),Bash(git config:*),Bash(git worktree:*),Read,Grep,Glob,Edit,Write,Skill,TodoWrite,Agent${{ steps.quality.outputs.allow }}"
            --max-turns 200
            ${{ steps.quality.outputs.sysprompt }}

      # Publica o que o agente e o QA gravaram na pasta de evidencias. Com
      # bucket: envia para o prefixo decidido antes da rodada, de modo que as
      # URLs ja escritas no PR passem a responder. Sem bucket, ou com upload
      # que falhou: a pasta vai como artifact da run e, se o PR citava URLs do
      # bucket, o passo seguinte as troca pelo link da run. Pasta vazia: nada
      # a fazer. Roda mesmo quando a action falhou, para nao perder captura.
      - name: Publicar evidencias
        id: publish
        if: always() && steps.target.outputs.skip != 'true' && steps.wip.outputs.skip != 'true' && steps.quality.outcome == 'success'
        env:
          DIR: ${{ steps.quality.outputs.dir }}
          MODE: ${{ steps.quality.outputs.mode }}
          PREFIX: ${{ steps.quality.outputs.prefix }}
          BASE_URL: ${{ steps.quality.outputs.base_url }}
          BUCKET: ${{ inputs.evidence_bucket }}
          ENDPOINT: ${{ inputs.evidence_endpoint }}
          AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
        run: |
          if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR")" ]; then
            echo "::notice::Pasta de evidencias vazia; nada a publicar."
            echo "artifact=false" >> "$GITHUB_OUTPUT"; echo "relink=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Evidencias gravadas:"; ls -la "$DIR"
          if [ "$MODE" = "bucket" ]; then
            if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
              echo "::warning::Secrets EVIDENCE_ACCESS_KEY_ID/EVIDENCE_SECRET_ACCESS_KEY ausentes; caindo para artifact."
            else
              ARGS=()
              if [ -n "$ENDPOINT" ]; then
                ARGS+=(--endpoint-url "$ENDPOINT"); export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
              else
                export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
              fi
              if aws s3 cp "$DIR" "${BUCKET%/}/${PREFIX}/" --recursive --no-progress "${ARGS[@]}"; then
                echo "::notice::Evidencias publicadas em ${BASE_URL}/"
                echo "artifact=false" >> "$GITHUB_OUTPUT"; echo "relink=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::warning::Upload para ${BUCKET} falhou; caindo para artifact da run."
            fi
            echo "relink=true" >> "$GITHUB_OUTPUT"
          else
            echo "relink=false" >> "$GITHUB_OUTPUT"
          fi
          echo "artifact=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always() && steps.publish.outputs.artifact == 'true'
        with:
          name: evidencias-${{ steps.target.outputs.number }}
          path: ${{ steps.quality.outputs.dir }}
          if-no-files-found: ignore

      # O PR foi escrito com URLs do bucket que nao vao responder: troca cada
      # imagem e link por um link para a run, onde o artifact esta.
      - name: Corrigir links de evidencia no PR
        if: always() && steps.publish.outputs.relink == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.target.outputs.number }}
          BASE_URL: ${{ steps.quality.outputs.base_url }}
          RUN_URL: ${{ steps.quality.outputs.run_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tempfile
          number, base, run = os.environ["NUMBER"], os.environ["BASE_URL"], os.environ["RUN_URL"]
          prs = json.loads(subprocess.check_output(
              ["gh", "pr", "list", "--state", "open", "--limit", "50", "--json", "number,body"]))
          closes = re.compile(r"Closes #%s\b" % re.escape(number))
          pr = next((p for p in prs if closes.search(p.get("body") or "")), None)
          if not pr:
              print(f"::notice::Nenhum PR aberto com Closes #{number}; nada a corrigir.")
              raise SystemExit(0)
          body = pr["body"]
          esc = re.escape(base)
          # imagem -> link; link -> link; URL solta -> URL da run com o nome do arquivo
          new = re.sub(r"!?\[([^\]]*)\]\(" + esc + r"/([^)\s]+)\)",
                       lambda m: f"[{m.group(1) or m.group(2)}: {m.group(2)} no artifact da run]({run})", body)
          new = re.sub(esc + r"/([^)\s<>]+)", lambda m: f"{run} (arquivo {m.group(1)} no artifact)", new)
          new = new.replace(base, run)
          if new == body:
              print("::notice::O PR nao citava URLs do bucket; nada a corrigir.")
              raise SystemExit(0)
          with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False) as f:
              f.write(new)
          subprocess.check_call(["gh", "pr", "edit", str(pr["number"]), "--body-file", f.name])
          print(f"::notice::PR #{pr['number']}: links de evidencia apontados para o artifact da run.")
          PY

      # Fim da rodada, com ou sem falha da action: tira o work-in-progress da
      # sub-task (so se foi este worker que o aplicou), consome um `go` que
      # sobrou (o de uma rodada recusada, ou um que chegou no meio), apura o
      # resultado e devolve o controle ao pai. O WIP sai ANTES do dispatch: o
      # planner le os labels da sub-task e um WIP atrasado o faria esperar por
      # um worker que ja acabou.
      #
      # Resultado: `pr` (PR aberto da branch sub-task-<n>), `handoff` (parou
      # em pergunta, awaiting-reply), `none` (acabou sem nenhum dos dois) ou
      # `skipped` (nao rodou). `source` diz quem pediu a rodada: o planner
      # (`chain`) ou um humano (`human`).
      - name: Devolver o controle ao pai
        if: always() && steps.target.outputs.parent != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.target.outputs.number }}
          PARENT: ${{ steps.target.outputs.parent }}
          SOURCE: ${{ steps.target.outputs.source }}
          SKIPPED: ${{ steps.target.outputs.skip == 'true' || steps.wip.outputs.skip == 'true' }}
          WIP_MINE: ${{ steps.wip.outcome == 'success' && steps.wip.outputs.skip != 'true' }}
        run: |
          if [ "$WIP_MINE" = "true" ]; then
            gh issue edit "$NUMBER" --remove-label work-in-progress
          fi
          if gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'go'; then
            echo "::notice::go consumido em #$NUMBER no fim da rodada."
            gh issue edit "$NUMBER" --remove-label go
          fi
          if [ "$SKIPPED" = "true" ]; then
            OUTCOME=skipped
          elif [ -n "$(gh pr list --head "sub-task-$NUMBER" --state open --json number -q '.[].number')" ]; then
            OUTCOME=pr
          elif gh issue view "$NUMBER" --json labels -q '.labels[].name' | grep -Fqx 'awaiting-reply'; then
            OUTCOME=handoff
          else
            OUTCOME=none
          fi
          echo "::notice::Resultado de #$NUMBER: $OUTCOME. Devolvendo ao pai #$PARENT."
          gh api --method POST "repos/$GH_REPO/dispatches" \
            -f event_type=ai-implement \
            -F "client_payload[issue]=$PARENT" \
            -F "client_payload[from]=$NUMBER" \
            -f "client_payload[outcome]=$OUTCOME" \
            -f "client_payload[source]=$SOURCE" \
            -F "client_payload[run]=$GITHUB_RUN_ID"
