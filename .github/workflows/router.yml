name: AI Router

# Workflow reutilizavel roteador. O repositorio consumidor tem UM workflow
# chamador (.github/workflows/ai.yml) com todos os gatilhos do fluxo e chama este
# arquivo. Cada job abaixo e um destino: o `if` decide se o evento e dele e o
# `uses` chama o reutilizavel correspondente. Assim a regra "qual evento
# aciona qual etapa" mora aqui e vale para todos os consumidores de uma vez.
#
# Job que nao passa no `if` e pulado sem consumir runner.
#
# Dois sinais humanos movem o fluxo:
#
# - o label `go`: "pode seguir". A etapa e a do label de estado que o issue
#   carrega (needs-triage → triagem, needs-refinement → refinamento,
#   needs-break-down → quebra, ready-for-agent → implementacao). Issue sem
#   label de estado vai para a triagem. E o unico sinal que inicia a
#   implementacao, e o que destrava um estado aplicado por token de workflow
#   ou de agente (label aplicado por token nao gera evento). A etapa consome
#   o `go` ao comecar, para ele poder ser aplicado de novo na seguinte.
# - um comentario humano, so em issue com `awaiting-reply`: e a resposta a
#   uma pergunta, e retoma a etapa do estado atual. Sem `awaiting-reply`,
#   comentario nao dispara nada.
#
# Um label de estado aplicado por humano (`needs-triage`, `needs-refinement`,
# `needs-break-down`) tambem dispara a etapa dele, sem precisar de `go`.
#
# Num PR aberto, a correcao (pr-fix) responde a uma acao explicita: review com
# *Request changes*, review ou comentario que cita `@claude`, ou comentario
# humano no PR com `awaiting-reply` (resposta a um handoff da correcao).
# Comentario sem nenhum desses sinais nao dispara nada.
#
# Um terceiro sinal e interno: `repository_dispatch`. Num pai com sub-tasks a
# implementacao e uma cadeia de runs (planner do pai -> worker da sub-task ->
# planner do pai -> ...), e cada elo chama o seguinte com esse evento, criado
# com o GITHUB_TOKEN (e, com workflow_dispatch, a unica excecao a regra de
# que evento criado pelo token nao dispara workflow). Dois tipos:
# `ai-implement` (payload: issue = o pai) chama o planner; `ai-sub-task`
# (payload: issue = a sub-task) chama o worker. O `go` numa `[SUB-TASK]` e
# o comentario humano respondendo ao handoff dela tambem vao para o worker.
#
# Os destinos sao referenciados pelo caminho completo (@main), nao por
# `./.github/workflows/...`: em chamada aninhada o caminho local resolve
# contra o repositorio do chamador de cima, nao contra este.
#
# O secret vai pelo nome a cada etapa, e nao por `secrets: inherit`: quando o
# chamador de cima esta em outro dono, o inherit nao repassa o secret nem
# aqui, e a etapa falha com "Secret ... is required, but not provided".
#
# O que NAO da para mover para ca (regra do GitHub): `on:` e `permissions:`
# ficam no chamador. Por isso o ai.yml ja nasce com todos os gatilhos
# e com a uniao das permissoes que as etapas pedem.
#
# Guardas comuns a todos os jobs de issue:
# - sem work-in-progress — outro worker ja esta atuando no issue;
# - `!github.event.issue.pull_request` — issue_comment tambem dispara em
#   comentario de PR, e comentario de PR e do job pr-fix;
# - `comment.user.type != 'Bot'` — so comentario humano conta como resposta.

on:
  workflow_call:
    inputs:
      setup_commands:
        description: >-
          Repassado ao implement: comandos de preparacao do ambiente do
          repositorio consumidor, um por linha, rodados pelo workflow antes de
          chamar o agente.
        type: string
        required: false
        default: ""
      quality_checks:
        description: >-
          Repassado ao implement: comandos de verificacao do repositorio
          consumidor, um por linha.
        type: string
        required: false
        default: ""
      evidence_tools:
        description: >-
          Repassado ao implement e ao worker de sub-task: prefixos de comando
          liberados ao agente para subir o projeto e capturar evidencias, um
          por linha. Liga o QA independente.
        type: string
        required: false
        default: ""
      evidence_bucket:
        description: >-
          Repassado ao implement e ao worker de sub-task: bucket compativel
          com S3 (`s3://bucket[/prefixo]`) que recebe as evidencias. Vazio:
          artifact da run.
        type: string
        required: false
        default: ""
      evidence_public_url:
        description: >-
          Repassado ao implement e ao worker de sub-task: URL publica da raiz
          de evidence_bucket.
        type: string
        required: false
        default: ""
      evidence_endpoint:
        description: >-
          Repassado ao implement e ao worker de sub-task: endpoint S3 fora da
          AWS (R2, MinIO). Vazio: AWS.
        type: string
        required: false
        default: ""
      ai_workflows_ref:
        description: >-
          Repassado ao implement e ao worker de sub-task: ref deste
          repositorio de onde baixar o planner (scripts/sub_tasks.py). So
          muda para testar uma branch daqui.
        type: string
        required: false
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # Credenciais do bucket de evidencias. Opcionais: sem elas, ou sem
      # evidence_bucket, as evidencias vao como artifact da run.
      EVIDENCE_ACCESS_KEY_ID:
        required: false
      EVIDENCE_SECRET_ACCESS_KEY:
        required: false
      # Variaveis do projeto para o ambiente do QA, no formato de um .env.
      # Opcional: sem ele, nenhuma variavel e carregada.
      PROJECT_ENV:
        required: false

jobs:
  # Autoverificacao do chamador. O ai.yml de cada consumidor e uma copia do
  # modelo deste repositorio, e ninguem avisa quando o modelo muda (foi o
  # caso do repository_dispatch: copia sem ele para na primeira sub-task).
  # Este job compara o ai.yml do consumidor com o modelo, na ref do router,
  # e, se divergir, avisa e abre no proprio consumidor um PR de atualizacao
  # pelo doctor (scripts/doctor.py fix --only ai-yml): inputs inline do
  # ai.yml antigo migram para .github/ai-workflows.yml no mesmo PR, e um PR
  # ja aberto e atualizado, nunca duplicado. Igual ao modelo: nada acontece.
  #
  # Roda nos eventos em que um humano esta agindo (label em issue, comentario
  # humano em issue ou PR e review humana), nao nos elos da cadeia de
  # sub-tasks nem no merge de PR. Nenhum job depende dele e ele nunca falha a
  # run: erro vira aviso. Nao ha input para desliga-lo.
  check-caller:
    name: Check caller
    if: >
      (github.event_name == 'issues' && github.event.action == 'labeled') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verificar o ai.yml do chamador
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ inputs.ai_workflows_ref }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          SRC="repos/samuel-morrissey/ai-workflows/contents"
          RAW="Accept: application/vnd.github.raw"
          if ! gh api "$SRC/.github/workflows/ai.yml?ref=$REF" -H "$RAW" > "$RUNNER_TEMP/modelo.yml" \
             || ! gh api "$SRC/scripts/doctor.py?ref=$REF" -H "$RAW" > "$RUNNER_TEMP/doctor.py"; then
            echo "::warning::check-caller: nao foi possivel baixar o modelo ou o doctor de samuel-morrissey/ai-workflows@$REF; verificacao pulada."
            exit 0
          fi
          gh api "repos/$GH_REPO/contents/.github/workflows/ai.yml?ref=$BRANCH" -H "$RAW" > "$RUNNER_TEMP/atual.yml" 2>/dev/null \
            || : > "$RUNNER_TEMP/atual.yml"
          DIFF="$(diff -u --label "ai.yml ($GH_REPO@$BRANCH)" --label "modelo (ai-workflows@$REF)" \
            <(sed 's/[[:space:]]*$//' "$RUNNER_TEMP/atual.yml") <(sed 's/[[:space:]]*$//' "$RUNNER_TEMP/modelo.yml"))"
          if [ -z "$DIFF" ]; then
            echo "ai.yml igual ao modelo (ai-workflows@$REF)."
            exit 0
          fi
          OUT="$(python3 -I "$RUNNER_TEMP/doctor.py" fix "$GH_REPO" --only ai-yml --ref "$REF" --json 2>"$RUNNER_TEMP/doctor.err")"
          RC=$?
          if [ "$RC" -eq 2 ] || [ -z "$OUT" ]; then
            RESUMO="o doctor nao conseguiu abrir o PR de atualizacao ($(tr '\n' ' ' < "$RUNNER_TEMP/doctor.err" | cut -c1-300))"
          else
            RESUMO="$(printf '%s' "$OUT" | python3 -I -c '
          import json, sys
          r = json.load(sys.stdin)
          f = next((x for x in r["findings"] if x["item"] == "ai-yml"), {})
          acts = [a for a in r.get("actions", []) if a != "nada a corrigir"]
          print((f.get("detail") or "") + ("" if not acts else " | " + "; ".join(acts)))')"
          fi
          echo "::warning title=ai.yml desatualizado::$GH_REPO: o .github/workflows/ai.yml difere do modelo de samuel-morrissey/ai-workflows@$REF. $RESUMO"
          {
            echo "## ai.yml desatualizado"
            echo
            echo "O \`.github/workflows/ai.yml\` de \`$GH_REPO\` difere do modelo de \`samuel-morrissey/ai-workflows@$REF\`."
            echo
            echo "$RESUMO"
            echo
            echo '```diff'
            echo "$DIFF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Triagem:
  # - `needs-triage` aplicado por humano;
  # - `go` em issue aberto com `needs-triage` ou sem nenhum label de estado
  #   (issue criado por agente, cujo `needs-triage` nao gerou evento; a etapa
  #   aplica o `needs-triage` que faltar). `[SUB-TASK]` nao conta: ela nao tem
  #   label de estado por desenho, e o `go` nela vai para o worker;
  # - `wontfix` ou `deferred` aplicado por humano: a skill completa o
  #   fechamento (tira o estado anterior, fecha e comenta o motivo). Label
  #   aplicado pelo token do workflow nao gera evento, entao a propria skill
  #   fechando nao dispara nova rodada;
  # - resposta humana a um handoff (`needs-triage` + `awaiting-reply`).
  issue-triage:
    if: >
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress') &&
       (github.event.label.name == 'needs-triage' ||
        github.event.label.name == 'wontfix' ||
        github.event.label.name == 'deferred' ||
        (github.event.label.name == 'go' &&
         github.event.issue.state == 'open' &&
         (contains(join(github.event.issue.labels.*.name, ','), 'needs-triage') ||
          (!startsWith(github.event.issue.title, '[SUB-TASK]') &&
           !contains(join(github.event.issue.labels.*.name, ','), 'needs-') &&
           !contains(join(github.event.issue.labels.*.name, ','), 'ready-for-') &&
           !contains(join(github.event.issue.labels.*.name, ','), 'awaiting-pr-review')))))) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(join(github.event.issue.labels.*.name, ','), 'needs-triage') &&
       contains(join(github.event.issue.labels.*.name, ','), 'awaiting-reply') &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress'))
    uses: samuel-morrissey/ai-workflows/.github/workflows/issue-triage.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Refinamento: `needs-refinement` aplicado por humano, `go` em issue com
  # `needs-refinement`, ou resposta humana a uma rodada de perguntas
  # (`needs-refinement` + `awaiting-reply`).
  issue-refinement:
    if: >
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress') &&
       (github.event.label.name == 'needs-refinement' ||
        (github.event.label.name == 'go' &&
         github.event.issue.state == 'open' &&
         contains(join(github.event.issue.labels.*.name, ','), 'needs-refinement')))) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(join(github.event.issue.labels.*.name, ','), 'needs-refinement') &&
       contains(join(github.event.issue.labels.*.name, ','), 'awaiting-reply') &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress'))
    uses: samuel-morrissey/ai-workflows/.github/workflows/issue-refinement.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Quebra em sub-tasks: `needs-break-down` aplicado por humano, `go` em issue
  # com `needs-break-down` (o caminho normal: a etapa anterior aplicou o
  # estado pelo token do workflow, sem evento), ou resposta humana a uma
  # pergunta (`needs-break-down` + `awaiting-reply`).
  issue-break-down:
    if: >
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress') &&
       (github.event.label.name == 'needs-break-down' ||
        (github.event.label.name == 'go' &&
         github.event.issue.state == 'open' &&
         contains(join(github.event.issue.labels.*.name, ','), 'needs-break-down')))) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(join(github.event.issue.labels.*.name, ','), 'needs-break-down') &&
       contains(join(github.event.issue.labels.*.name, ','), 'awaiting-reply') &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress'))
    uses: samuel-morrissey/ai-workflows/.github/workflows/issue-break-down.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Implementacao: `go` em issue aberto com `ready-for-agent`, resposta
  # humana a um handoff da implementacao (`ready-for-agent` +
  # `awaiting-reply`), ou o worker de uma sub-task devolvendo o controle ao
  # pai (`repository_dispatch` do tipo `ai-implement`). Aplicar
  # `ready-for-agent` nao inicia nada — e o humano quem da o "vai" com o
  # `go`. Num pai com sub-tasks, o work-in-progress fica no pai durante a
  # cadeia inteira; por isso o guarda vale para o `go`, mas nao para o
  # dispatch, que e justamente a cadeia continuando. A concorrencia por
  # issue serializa os planners de um mesmo pai.
  issue-remote-implement:
    if: >
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'ai-implement') ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'go' &&
       github.event.issue.state == 'open' &&
       contains(join(github.event.issue.labels.*.name, ','), 'ready-for-agent') &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress')) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(join(github.event.issue.labels.*.name, ','), 'ready-for-agent') &&
       contains(join(github.event.issue.labels.*.name, ','), 'awaiting-reply') &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress'))
    concurrency:
      group: ai-implement-${{ github.repository }}-${{ github.event.issue.number || github.event.client_payload.issue }}
      cancel-in-progress: false
    uses: samuel-morrissey/ai-workflows/.github/workflows/issue-remote-implement.yml@main
    with:
      setup_commands: ${{ inputs.setup_commands }}
      quality_checks: ${{ inputs.quality_checks }}
      evidence_tools: ${{ inputs.evidence_tools }}
      evidence_bucket: ${{ inputs.evidence_bucket }}
      evidence_public_url: ${{ inputs.evidence_public_url }}
      evidence_endpoint: ${{ inputs.evidence_endpoint }}
      ai_workflows_ref: ${{ inputs.ai_workflows_ref }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EVIDENCE_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      EVIDENCE_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      PROJECT_ENV: ${{ secrets.PROJECT_ENV }}

  # Sub-task: o planner do pai despachou a proxima (`repository_dispatch` do
  # tipo `ai-sub-task`), um humano aplicou `go` numa `[SUB-TASK]` aberta (roda
  # so ela), ou respondeu a um handoff dela (`[SUB-TASK]` + `awaiting-reply`).
  # Sub-task nao tem label de estado: o que a identifica e o prefixo do
  # titulo. O worker devolve o controle ao pai no fim.
  issue-sub-task:
    if: >
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'ai-sub-task') ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'go' &&
       github.event.issue.state == 'open' &&
       startsWith(github.event.issue.title, '[SUB-TASK]') &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress')) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       startsWith(github.event.issue.title, '[SUB-TASK]') &&
       contains(join(github.event.issue.labels.*.name, ','), 'awaiting-reply') &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress'))
    concurrency:
      group: ai-sub-task-${{ github.repository }}-${{ github.event.issue.number || github.event.client_payload.issue }}
      cancel-in-progress: false
    uses: samuel-morrissey/ai-workflows/.github/workflows/issue-sub-task.yml@main
    with:
      setup_commands: ${{ inputs.setup_commands }}
      quality_checks: ${{ inputs.quality_checks }}
      evidence_tools: ${{ inputs.evidence_tools }}
      evidence_bucket: ${{ inputs.evidence_bucket }}
      evidence_public_url: ${{ inputs.evidence_public_url }}
      evidence_endpoint: ${{ inputs.evidence_endpoint }}
      ai_workflows_ref: ${{ inputs.ai_workflows_ref }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EVIDENCE_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      EVIDENCE_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      PROJECT_ENV: ${{ secrets.PROJECT_ENV }}

  # Correcao de PR: acao humana explicita num PR aberto.
  # - review enviada com *Request changes* (`review.state` chega em
  #   minusculas: `changes_requested`), ou review cujo corpo cita `@claude`.
  #   A review traz o PR no payload: PR de fork sai ja aqui, pela head;
  # - comentario no PR que cita `@claude`, ou qualquer comentario humano no
  #   PR com `awaiting-reply` (resposta a um handoff da correcao). PR de fork
  #   sai no workflow, que resolve a head pelo gh.
  # Comentario de linha avulso (pull_request_review_comment) nao e gatilho:
  # cada comentario de uma review gera um evento proprio, e a review que os
  # contem ja e o pedido inteiro. A concorrencia por PR serializa as rodadas.
  pr-fix:
    if: >
      (github.event_name == 'pull_request_review' &&
       github.event.action == 'submitted' &&
       github.event.review.user.type != 'Bot' &&
       github.event.pull_request.state == 'open' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !contains(join(github.event.pull_request.labels.*.name, ','), 'work-in-progress') &&
       (github.event.review.state == 'changes_requested' ||
        contains(github.event.review.body, '@claude'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.comment.user.type != 'Bot' &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress') &&
       (contains(github.event.comment.body, '@claude') ||
        contains(join(github.event.issue.labels.*.name, ','), 'awaiting-reply')))
    concurrency:
      group: ai-pr-fix-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    uses: samuel-morrissey/ai-workflows/.github/workflows/pr-fix.yml@main
    with:
      setup_commands: ${{ inputs.setup_commands }}
      quality_checks: ${{ inputs.quality_checks }}
      evidence_tools: ${{ inputs.evidence_tools }}
      evidence_bucket: ${{ inputs.evidence_bucket }}
      evidence_public_url: ${{ inputs.evidence_public_url }}
      evidence_endpoint: ${{ inputs.evidence_endpoint }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EVIDENCE_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      EVIDENCE_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      PROJECT_ENV: ${{ secrets.PROJECT_ENV }}

  # PR mergeado numa branch que nao e a padrao: fecha os issues do `Closes`,
  # que o GitHub ignora fora da branch padrao. Na branch padrao o proprio
  # GitHub fecha. Um PR de camada superior de uma stack chega aqui com a base
  # original (a branch da camada de baixo), mas o GitHub ja fechou os issues
  # dele ao levar a stack para a branch padrao: o job so tira o
  # awaiting-pr-review que sobrou.
  pr-merged:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    uses: samuel-morrissey/ai-workflows/.github/workflows/pr-merged.yml@main
