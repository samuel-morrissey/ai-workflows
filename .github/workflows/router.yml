name: AI Router

# Workflow reutilizavel roteador. O repositorio consumidor tem UM workflow
# chamador (.github/workflows/ai.yml) com todos os gatilhos do fluxo e chama este
# arquivo. Cada job abaixo e um destino: o `if` decide se o evento e dele e o
# `uses` chama o reutilizavel correspondente. Assim a regra "qual evento
# aciona qual etapa" mora aqui e vale para todos os consumidores de uma vez.
#
# Job que nao passa no `if` e pulado sem consumir runner.
#
# Os destinos sao referenciados pelo caminho completo (@main), nao por
# `./.github/workflows/...`: em chamada aninhada o caminho local resolve
# contra o repositorio do chamador de cima, nao contra este.
#
# O que NAO da para mover para ca (regra do GitHub): `on:` e `permissions:`
# ficam no chamador. Por isso o ai.yml ja nasce com todos os gatilhos
# e com a uniao das permissoes que as etapas pedem.

on:
  workflow_call:
    inputs:
      setup_commands:
        description: >-
          Repassado ao implement: comandos de preparacao do ambiente do
          repositorio consumidor, um por linha, rodados pelo workflow antes de
          chamar o agente.
        type: string
        required: false
        default: ""
      quality_checks:
        description: >-
          Repassado ao implement: comandos de verificacao do repositorio
          consumidor, um por linha.
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # Triagem: label `need-triage` aplicado, ou comentario humano em issue que
  # ainda carrega `need-triage` (resposta a um handoff).
  # - `!github.event.issue.pull_request` — issue_comment tambem dispara em
  #   comentario de PR, e triagem de PR esta fora de escopo;
  # - `comment.user.type != 'Bot'` — so comentario humano reativa a triagem;
  # - sem work-in-progress — outro worker ja esta atuando no issue.
  issue-triage:
    if: >
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'need-triage' &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress')) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(join(github.event.issue.labels.*.name, ','), 'need-triage') &&
       !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress'))
    uses: caravelasistemas/ai-workflows/.github/workflows/issue-triage.yml@main
    secrets: inherit

  # Implementacao: comentario humano contendo `/implement` em issue com
  # `ready-for-agent`. Aplicar o label nao inicia nada — e o humano quem da o
  # "vai" comentando.
  issue-remote-implement:
    if: >
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/implement') &&
      contains(join(github.event.issue.labels.*.name, ','), 'ready-for-agent') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'work-in-progress')
    uses: caravelasistemas/ai-workflows/.github/workflows/issue-remote-implement.yml@main
    with:
      setup_commands: ${{ inputs.setup_commands }}
      quality_checks: ${{ inputs.quality_checks }}
    secrets: inherit
