name: AI

# Workflow chamador dos fluxos de IA. Copie este arquivo para
# `.github/workflows/ai.yml` no repositorio consumidor.
#
# As regras (qual evento aciona qual etapa, guardas, labels) moram no
# router.yml de caravelasistemas/ai-workflows. Este arquivo so declara o que o
# GitHub exige que fique no chamador: gatilhos (`on:`) e permissoes.
#
# Antes de usar, no repositorio consumidor:
# - crie o secret CLAUDE_CODE_OAUTH_TOKEN (gere com `claude setup-token`);
# - ajuste `quality_checks` para os comandos de verificacao do projeto.
#
# Labels do fluxo (need-triage, ready-for-agent...) sao criados pela skill
# issue-triage quando faltam; work-in-progress e criado pelos workflows.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Uniao das permissoes pedidas pelas etapas. Um reutilizavel nunca recebe mais
# do que o chamador concede, por isso todas ficam aqui.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  ai:
    uses: caravelasistemas/ai-workflows/.github/workflows/router.yml@main
    with:
      # Comandos de verificacao de qualidade, um por linha. Rodados pela etapa
      # issue-remote-implement antes de abrir o PR. Vazio: segue sem verificacao.
      quality_checks: |
        npm run typecheck
        npm test
    secrets: inherit
